name: Bug report
description: Report a reproducible Quantary defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private datasets, reports, or broker credentials.
  - type: input
    id: version
    attributes:
      label: Quantary version
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Mock, Live AI, RAG indexing, Market data, Paper trading, Other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and minimal reproduction steps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and private research/data from this report.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
