[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-factor-rd-agent"
version = "0.3.0"
description = "Quantary: an evidence-grounded AI workspace for auditable quantitative factor research."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "HowrdWng"}]
keywords = ["quantitative-finance", "factor-research", "ai-agent", "rag", "langgraph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
  "fastapi>=0.116,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.8,<3",
  "pypdf>=5.0,<7",
  "scipy>=1.12,<2",
  "typing-extensions>=4.12",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/HowrdWng/quant-factor-rd-agent"
Documentation = "https://github.com/HowrdWng/quant-factor-rd-agent#readme"
Issues = "https://github.com/HowrdWng/quant-factor-rd-agent/issues"
Repository = "https://github.com/HowrdWng/quant-factor-rd-agent.git"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[project.scripts]
quant-factor-agent = "quant_factor_agent.cli:main"
quant-factor-web = "quant_factor_agent.web:main"

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
quant_factor_agent = ["web_static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
  "app/quant_factor_agent/cli.py",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
